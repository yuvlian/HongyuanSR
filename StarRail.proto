	int64 head_frame_expire_time = 2;
}

message AssistSimpleInfo {
	uint32 avatar_id = 1;
	uint32 level = 2;
	uint32 dressed_skin_id = 3;
	uint32 pos = 4;
}

message PlayerSimpleInfo {
	uint32 uid = 1;
	string nickname = 2;
	uint32 level = 3;
	uint32 head_icon = 4;
	string signature = 5;
	bool is_banned = 6;
	FriendOnlineStatus online_status = 7;
	int64 update_time = 8;
	PlatformType platform = 9;
	string platform_uuid = 10;
	string platform_nick = 11;
	uint32 personal_card = 12;
