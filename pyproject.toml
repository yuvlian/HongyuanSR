[project]
name = "echium-server"
version = "4.4.55" # version of game supported
description = "Honkai: Star Rail Private Server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "betterproto2-compiler>=0.9.0",
    "betterproto2[all]>=0.9.1",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
]

[tool.ruff]
exclude = ["kcpshimmy"]

[tool.ruff.lint.per-file-ignores]
"gameserver/handler.py" = ["E402", "F401"]

