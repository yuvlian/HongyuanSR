[project]
name = "echium-server"
version = "4.5.52" # version of game supported
description = "Honkai: Star Rail Private Server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "betterproto2-compiler>=0.9.0",
    "betterproto2[all]>=0.9.1",
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
]

[tool.ruff]
exclude = ["kcpshimmy"]

[tool.ruff.lint.per-file-ignores]
"gameserver/handler.py" = ["E402", "F401"]

[tool.uv.sources]
betterproto2-compiler = { git = "https://github.com/yuvlian/fasterproto2", subdirectory = "betterproto2_compiler", rev = "b4d1805" }
betterproto2 = { git = "https://github.com/yuvlian/fasterproto2", subdirectory = "betterproto2", rev = "b4d1805" }

